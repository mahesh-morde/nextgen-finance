<div class="custom-card" [class.glass]="glass" [class.interactive]="interactive">
  <div class="card-header" *ngIf="title || subtitle">
    <h5 class="card-title" *ngIf="title">{{ title }}</h5>
    <h6 class="card-subtitle text-muted" *ngIf="subtitle">{{ subtitle }}</h6>
    <ng-content select="[header-actions]"></ng-content>
  </div>
  <div class="card-body" [class.p-0]="noPadding">
    <ng-content></ng-content>
  </div>
  <div class="card-footer">
    <ng-content select="[footer]"></ng-content>
  </div>
</div>
